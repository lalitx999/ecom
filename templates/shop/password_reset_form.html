{% extends 'base.html' %}
{% block title %}ลืมรหัสผ่าน{% endblock %}
{% block content %}
<div class="container py-4 py-lg-5"><div class="auth-card">
  <h1 class="section-title mb-2">ลืมรหัสผ่าน</h1>
  <p class="text-muted-2">กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้</p>
  <form method="post" novalidate>{% csrf_token %}
    {% for field in form %}{% include 'shop/_field.html' %}{% endfor %}
    <button class="btn btn-primary w-100 mt-2" style="height:52px">ส่งลิงก์ตั้งรหัสผ่านใหม่</button>
  </form>
  <p class="text-center mt-4 mb-0"><a class="fw-bold" href="{% url 'shop:login' %}">กลับไปเข้าสู่ระบบ</a></p>
</div></div>
{% endblock %}
